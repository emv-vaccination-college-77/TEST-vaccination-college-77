<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autorisation vaccination HPV / ACWY</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue-900:#0b3d5c;
    --blue-700:#0e6ba8;
    --blue-100:#e7f2f9;
    --green-700:#1e7d32;
    --green-100:#e6f4ea;
    --green-border:#a8d5b5;
    --red-700:#b3261e;
    --red-100:#fbe9e7;
    --red-border:#e8b4af;
    --ink:#1c2530;
    --ink-soft:#5b6672;
    --line:#d7dee5;
    --bg:#f4f7f9;
    --card:#ffffff;
    --focus:#0e6ba8;
  }
  :root:not([data-theme="light"]){
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8edf2;
      --ink-soft:#a8b3bd;
      --line:#2c3a46;
      --bg:#111820;
      --card:#182229;
      --blue-100:#132b3a;
      --green-100:#12281a;
      --green-border:#255c37;
      --red-100:#331c1a;
      --red-border:#7a3530;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e8edf2;
    --ink-soft:#a8b3bd;
    --line:#2c3a46;
    --bg:#111820;
    --card:#182229;
    --blue-100:#132b3a;
    --green-100:#12281a;
    --green-border:#255c37;
    --red-100:#331c1a;
    --red-border:#7a3530;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    padding:24px 14px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header.page-head{text-align:center;margin-bottom:22px;}
  header.page-head h1{
    font-size:1.28rem;
    line-height:1.35;
    color:var(--blue-900);
    margin:0 0 6px;
    font-weight:700;
  }
  header.page-head p{color:var(--ink-soft);font-size:.92rem;margin:0;}

  .stepper{display:flex;gap:6px;margin-bottom:22px;}
  .stepper .dot{
    flex:1;
    height:6px;
    border-radius:4px;
    background:var(--line);
    transition:background .25s ease;
  }
  .stepper .dot.done,.stepper .dot.active{background:var(--blue-700);}

  .step-label{
    text-align:center;
    font-size:.82rem;
    color:var(--ink-soft);
    margin-bottom:18px;
  }
  .step-label strong{color:var(--blue-900);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }

  .step{display:none;}
  .step.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  h2.section-title{
    font-size:1.02rem;
    color:var(--blue-900);
    margin:0 0 16px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:.86rem;
    font-weight:600;
    margin-bottom:6px;
    color:var(--ink);
  }
  .field .hint{font-size:.78rem;color:var(--ink-soft);margin-top:4px;}
  input[type=text],input[type=tel],input[type=date],select{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
    font-size:.95rem;
    font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--focus);
    outline-offset:1px;
  }
  .field-invalid{
    border-color:#c62828 !important;
    box-shadow:0 0 0 2px rgba(198,38,38,.15);
  }
  .carnet-option.field-invalid, .sig-wrap.field-invalid{
    border-color:#c62828;
    box-shadow:0 0 0 2px rgba(198,38,38,.15);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:480px){.row2{grid-template-columns:1fr;}}

  .parent-block{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 14px 4px;
    margin-bottom:14px;
  }
  .parent-block h3{margin:0 0 12px;font-size:.92rem;color:var(--blue-700);}

  fieldset{border:none;margin:0;padding:0;}
  .radio-line{
    display:flex;align-items:center;gap:8px;margin:2px -8px;font-size:.9rem;
    cursor:pointer;padding:8px;border-radius:8px;transition:background .12s ease;
  }
  .radio-line:hover{background:var(--blue-100);}
  .radio-line input{width:auto;flex-shrink:0;}
  .radio-line label{cursor:pointer;width:100%;}

  .auth-block{
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
    border:1px solid var(--line);
  }
  .auth-block .auth-title{font-weight:700;font-size:.94rem;margin-bottom:4px;}
  .auth-block .auth-sub{font-size:.82rem;color:var(--ink-soft);margin-bottom:10px;}
  .auth-choice{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .choice-btn{
    flex:1;
    min-width:140px;
    text-align:center;
    padding:10px 8px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--card);
    cursor:pointer;
    font-size:.86rem;
    font-weight:600;
    color:var(--ink-soft);
    transition:all .15s ease;
  }
  .choice-btn.yes.selected{
    background:var(--green-100);
    border-color:var(--green-border);
    color:var(--green-700);
  }
  .choice-btn.no.selected{
    background:var(--red-100);
    border-color:var(--red-border);
    color:var(--red-700);
  }
  .sub-checks{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .sub-checks.show{display:block;}
  .sub-check-line{margin-bottom:10px;}
  .sub-check-line label{
    display:flex;gap:8px;align-items:flex-start;font-size:.86rem;font-weight:600;
    cursor:pointer;padding:8px;margin:0 -8px;border-radius:8px;
    transition:background .12s ease;
  }
  .sub-check-line label:hover{background:var(--blue-100);}
  .sub-check-line label:active{background:var(--green-100);}
  .sub-check-line input{width:auto;margin-top:3px;flex-shrink:0;}
  .sub-check-line .sub-hint{font-weight:400;color:var(--ink-soft);font-size:.78rem;margin-top:2px;margin-left:24px;}

  .carnet-option{
    display:flex;
    gap:10px;
    align-items:flex-start;
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    transition:background .12s ease, border-color .12s ease;
  }
  .carnet-option:hover{background:var(--blue-100);}
  .carnet-option.selected{border-color:var(--blue-700);background:var(--blue-100);}
  .carnet-option input{margin-top:3px;width:auto;flex-shrink:0;}

  .sig-wrap{
    border:1px dashed var(--line);
    border-radius:10px;
    overflow:hidden;
    background:var(--card);
    touch-action:none;
  }
  canvas.sig-pad{
    width:100%;
    height:150px;
    display:block;
    background:#fff;
    touch-action:none;
  }
  .sig-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  .sig-actions button{
    background:none;
    border:none;
    color:var(--blue-700);
    font-size:.82rem;
    cursor:pointer;
    padding:4px 0;
  }
  .sig-empty-note{font-size:.78rem;color:var(--ink-soft);}

  .solo-checks{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .solo-checks .field label{
    font-weight:400;display:flex;gap:8px;align-items:flex-start;
    cursor:pointer;padding:8px;margin:0 -8px;border-radius:8px;
    transition:background .12s ease;
  }
  .solo-checks .field label:hover{background:var(--blue-100);}
  .solo-checks .field label:active{background:var(--green-100);}
  .solo-checks input{width:auto;margin-top:3px;flex-shrink:0;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-top:22px;
  }
  button.nav-btn{
    flex:1;
    padding:13px 14px;
    border-radius:9px;
    font-size:.94rem;
    font-weight:600;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  button.nav-btn.primary{
    background:var(--blue-700);
    border-color:var(--blue-700);
    color:#fff;
  }
  button.nav-btn.primary:disabled{opacity:.5;cursor:not-allowed;}
  button.nav-btn:active{transform:scale(.98);}

  .error-msg{
    color:var(--red-700);
    font-size:.82rem;
    margin-top:8px;
    display:none;
  }
  .error-msg.show{display:block;}

  .summary-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:.86rem;
  }
  .summary-item span:first-child{color:var(--ink-soft);}
  .summary-item span:last-child{font-weight:600;text-align:right;}

  .final-actions{text-align:center;margin-top:20px;}
  .final-actions .big-check{font-size:2.2rem;margin-bottom:6px;}
  .final-actions p{color:var(--ink-soft);font-size:.9rem;margin-bottom:18px;}
  #sendEmailBtn{
    width:100%;
    padding:14px;
    border-radius:9px;
    background:var(--blue-700);
    color:#fff;
    border:none;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
  }
  #sendEmailBtn:disabled{opacity:.6;cursor:wait;}
  #emailSentNote{
    display:none;
    margin-top:14px;
    font-size:.85rem;
    color:var(--green-700);
    background:var(--green-100);
    border:1px solid var(--green-border);
    padding:10px 12px;
    border-radius:8px;
  }
  #downloadBtn{
    width:100%;
    padding:11px;
    border-radius:9px;
    background:none;
    color:var(--blue-700);
    border:1px solid var(--line);
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
  }
  #downloadedNote{
    display:none;
    margin-top:14px;
    font-size:.85rem;
    color:var(--green-700);
    background:var(--green-100);
    border:1px solid var(--green-border);
    padding:10px 12px;
    border-radius:8px;
  }
  #downloadBtn:disabled{opacity:.6;cursor:wait;}

  .captcha-box{
    margin:14px 0;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
  }
  .captcha-box label{
    display:block;
    font-size:.86rem;
    font-weight:600;
    margin-bottom:6px;
  }
  .captcha-box input{
    width:80px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--card);
    color:var(--ink);
    font-size:.95rem;
  }
  .captcha-box input.field-invalid{
    border-color:#c62828 !important;
    box-shadow:0 0 0 2px rgba(198,38,38,.15);
  }
  .captcha-box .error-msg{margin-top:8px;margin-bottom:0;}

  .reassurance-msg{
    display:none;
    font-size:.82rem;
    color:var(--ink-soft);
    background:var(--blue-100);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    margin:14px 0 4px;
    text-align:center;
  }
  .alt-send-divider{
    text-align:center;
    font-size:.8rem;
    color:var(--ink-soft);
    margin:22px 0 10px;
    position:relative;
  }
  .alt-send-divider:before{
    content:'';
    display:block;
    border-top:1px solid var(--line);
    margin-bottom:10px;
  }
  .mailto-btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    text-align:center;
    padding:11px;
    border-radius:9px;
    background:none;
    color:var(--blue-700);
    border:1px solid var(--line);
    font-size:.88rem;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
    text-decoration:none;
  }

  /* ---- Gabarit d'impression : reproduction fidèle du document original ---- */
</style>

<style>
  /* ===== Sélecteur de langue (style aligné sur le site principal) ===== */
  .langBar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin-bottom:16px;
  }
  .langBtn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    padding:6px 10px;
    border-radius:999px;
    cursor:pointer;
    font-size:.78rem;
    font-weight:700;
    line-height:1;
  }
  .langBtn:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .langBtn.active{background:var(--blue-100);border-color:var(--blue-700);color:var(--blue-900);}

  .pdf-note{
    text-align:center;
    font-size:.76rem;
    color:var(--ink-soft);
    font-style:italic;
    margin:-10px 0 18px;
  }

  /* ===== RTL (arabe, pachto, kurde) ===== */
  html[dir="rtl"] body{direction:rtl;text-align:right;}
  html[dir="rtl"] .field label{text-align:right;}
  html[dir="rtl"] .sig-actions{flex-direction:row-reverse;}
  html[dir="rtl"] .choice-btn{text-align:center;}
  html[dir="rtl"] .sub-hint{margin-left:0;margin-right:24px;}
  html[dir="rtl"] .nav-row{flex-direction:row-reverse;}
  html[dir="rtl"] .summary-item{flex-direction:row-reverse;}
  html[dir="rtl"] .carnet-option{flex-direction:row-reverse;}
  html[dir="rtl"] .solo-checks .field label{flex-direction:row-reverse;}
  html[dir="rtl"] .sub-check-line label{flex-direction:row-reverse;}
</style>
</head>
<body>
<div class="wrap">
  <div class="langBar" id="langBar"></div>
  <header class="page-head">
    <h1 data-i18n="pageTitle"></h1>
    <p data-i18n="pageSubtitle"></p>
  </header>

  <div class="stepper" id="stepper"></div>
  <div class="step-label" id="stepLabelLine"></div>

  <div class="card">
    <form id="vaccForm" novalidate>

      <!-- Étape 1 : enfant -->
      <section class="step active" data-step="1">
        <h2 class="section-title" data-i18n="step1Title"></h2>
        <div class="row2">
          <div class="field">
            <label for="childLastName" data-i18n="childLastNameLabel"></label>
            <input type="text" id="childLastName" required>
          </div>
          <div class="field">
            <label for="childFirstName" data-i18n="childFirstNameLabel"></label>
            <input type="text" id="childFirstName" required>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="childDob" data-i18n="childDobLabel"></label>
            <input type="date" id="childDob" required>
          </div>
          <div class="field">
            <label for="childSex" data-i18n="childSexLabel"></label>
            <select id="childSex" required>
              <option value="" data-i18n="sexSelectPlaceholder"></option>
              <option value="F" data-i18n="sexFemale"></option>
              <option value="G" data-i18n="sexMale"></option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="childClass" data-i18n="childClassLabel"></label>
          <input type="text" id="childClass" data-i18n-placeholder="childClassPlaceholder" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="schoolName" data-i18n="schoolNameLabel"></label>
            <select id="schoolName" required></select>
          </div>
          <div class="field">
            <label for="schoolTown" data-i18n="schoolTownLabel"></label>
            <select id="schoolTown" required></select>
          </div>
        </div>
      </section>

      <!-- Étape 2 : parents -->
      <section class="step" data-step="2">
        <h2 class="section-title" data-i18n="step2Title"></h2>

        <div class="parent-block">
          <h3 data-i18n="parent1Title"></h3>
          <div class="field">
            <label for="p1Name" data-i18n="nameLabel"></label>
            <input type="text" id="p1Name" required>
          </div>
          <div class="field">
            <label for="p1Phone" data-i18n="phoneLabel"></label>
            <input type="tel" id="p1Phone" required>
          </div>
          <div class="field">
            <label for="p1Nir" data-i18n="nirLabel"></label>
            <input type="text" id="p1Nir" maxlength="15" data-i18n-placeholder="nirPlaceholder" required>
          </div>
        </div>

        <div class="parent-block">
          <h3><span data-i18n="parent2Title"></span> <span style="font-weight:400;color:var(--ink-soft);" data-i18n="optionalTag"></span></h3>
          <div class="field">
            <label for="p2Name" data-i18n="nameLabel"></label>
            <input type="text" id="p2Name">
          </div>
          <div class="field">
            <label for="p2Phone" data-i18n="phoneLabel"></label>
            <input type="tel" id="p2Phone">
          </div>
          <div class="field">
            <label for="p2Nir" data-i18n="nirLabel"></label>
            <input type="text" id="p2Nir" maxlength="15" data-i18n-placeholder="nirPlaceholder">
          </div>
        </div>

        <div class="field">
          <label data-i18n="attachLabel"></label>
          <div class="radio-line"><input type="radio" name="attach" value="1" id="attach1" required><label for="attach1" style="margin:0;font-weight:400;" data-i18n="parent1Title"></label></div>
          <div class="radio-line"><input type="radio" name="attach" value="2" id="attach2"><label for="attach2" style="margin:0;font-weight:400;" data-i18n="parent2Title"></label></div>
        </div>
      </section>

      <!-- Étape 3 : autorisations -->
      <section class="step" data-step="3">
        <h2 class="section-title" data-i18n="step3Title"></h2>

        <div class="auth-block" id="blockHpv">
          <div class="auth-title" data-i18n="hpvTitle"></div>
          <div class="auth-sub" data-i18n="hpvSub"></div>
          <div class="auth-choice">
            <div class="choice-btn yes" data-group="hpv" data-value="yes" data-i18n="authYes"></div>
            <div class="choice-btn no" data-group="hpv" data-value="no" data-i18n="authNo"></div>
          </div>
        </div>

        <div class="auth-block" id="blockAcwy">
          <div class="auth-title" data-i18n="acwyTitle"></div>
          <div class="auth-sub" data-i18n="acwySub"></div>
          <div class="auth-choice">
            <div class="choice-btn yes" data-group="acwy" data-value="yes" data-i18n="authYes"></div>
            <div class="choice-btn no" data-group="acwy" data-value="no" data-i18n="authNo"></div>
          </div>
        </div>

        <div class="auth-block" id="blockOther">
          <div class="auth-title" data-i18n="otherTitle"></div>
          <div class="auth-sub" data-i18n="otherSub"></div>
          <div class="auth-choice">
            <div class="choice-btn yes" data-group="other" data-value="yes" data-i18n="authYes"></div>
            <div class="choice-btn no" data-group="other" data-value="no" data-i18n="authNo"></div>
          </div>
          <div class="sub-checks" id="otherSub">
            <div class="sub-check-line">
              <label><input type="checkbox" id="subDtp"> <span data-i18n="dtpLabel"></span></label>
              <div class="sub-hint" data-i18n="dtpHint"></div>
            </div>
            <div class="sub-check-line">
              <label><input type="checkbox" id="subRor"> <span data-i18n="rorLabel"></span></label>
              <div class="sub-hint" data-i18n="rorHint"></div>
            </div>
            <div class="sub-check-line">
              <label><input type="checkbox" id="subHepb"> <span data-i18n="hepbLabel"></span></label>
              <div class="sub-hint" data-i18n="hepbHint"></div>
            </div>
          </div>
        </div>
        <div class="error-msg" id="authError" data-i18n="authError"></div>
      </section>

      <!-- Étape 4 : carnet de santé -->
      <section class="step" data-step="4">
        <h2 class="section-title" data-i18n="step4Title"></h2>
        <p style="font-size:.88rem;color:var(--ink-soft);margin-top:-6px;" data-i18n="carnetIntro"></p>
        <label class="carnet-option" id="carnetOpt1">
          <input type="radio" name="carnet" value="fourni" id="carnetFourni" required>
          <span data-i18n="carnetFourni"></span>
        </label>
        <label class="carnet-option" id="carnetOpt2">
          <input type="radio" name="carnet" value="absent" id="carnetAbsent">
          <span data-i18n="carnetAbsent"></span>
        </label>
      </section>

      <!-- Étape 5 : signatures -->
      <section class="step" data-step="5">
        <h2 class="section-title" data-i18n="step5Title"></h2>
        <p style="font-size:.86rem;color:var(--ink-soft);margin-top:-6px;" data-i18n="signIntro"></p>

        <div class="field">
          <label for="signDate" data-i18n="dateLabel"></label>
          <input type="date" id="signDate" required>
        </div>

        <div class="field">
          <label data-i18n="sig1Label"></label>
          <div class="sig-wrap"><canvas class="sig-pad" id="sig1"></canvas></div>
          <div class="sig-actions">
            <button type="button" onclick="clearSig(1)" data-i18n="clearBtn"></button>
            <span class="sig-empty-note" id="sig1note" data-i18n="sigHint"></span>
          </div>
        </div>

        <div class="field">

const SUPPORTED_LANGS = ["fr","en","ar","tr","ps","ku","ro","ka"];
function detectInitialLang(){
  try{
    const params = new URLSearchParams(window.location.search);
    const fromUrl = params.get('lang');
    if(fromUrl && SUPPORTED_LANGS.includes(fromUrl)) return fromUrl;
  }catch(e){}
  return 'fr';
}
let currentLang = detectInitialLang();

function tr(key){
  const dict = I18N[currentLang] || I18N.fr;
  return (dict && dict[key] !== undefined) ? dict[key] : (I18N.fr[key] || '');
}

function buildLangBar(){
  const bar = document.getElementById('langBar');
  bar.innerHTML = '';
  SUPPORTED_LANGS.forEach(code=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'langBtn' + (code===currentLang ? ' active' : '');
    b.textContent = I18N[code].langName;
    b.addEventListener('click', ()=>{
      if(code === currentLang) return;
      currentLang = code;
      applyLanguage();
    });
    bar.appendChild(b);
  });
}

function applyLanguage(){
  const dict = I18N[currentLang] || I18N.fr;
  document.documentElement.setAttribute('lang', currentLang);
  document.documentElement.setAttribute('dir', dict.dir);
  document.title = dict.pageTitle;

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    const val = tr(key);
    if(val) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    const key = el.getAttribute('data-i18n-placeholder');
    const val = tr(key);
    if(val) el.setAttribute('placeholder', val);
  });

  buildLangBar();
  renderStepper();

  // Rafraîchit le texte "Sélectionner" des menus collège/commune dans la nouvelle langue,
  // en conservant le filtre commune en cours (si un collège est déjà choisi)
  const currentCommune = document.getElementById('schoolTown').value;
  populateCommuneSelect();
  populateCollegeSelect(currentCommune || null);

  updateCaptchaLabel();
  if(current === totalSteps) buildSummary();
}

const totalSteps = 6;
let current = 1;

const stepperEl = document.getElementById('stepper');
for(let i=1;i<=totalSteps;i++){
  const d = document.createElement('div');
  d.className = 'dot';
  d.id = 'dot'+i;
  stepperEl.appendChild(d);
}

function renderStepper(){
  const dict = I18N[currentLang] || I18N.fr;
  for(let i=1;i<=totalSteps;i++){
    const d = document.getElementById('dot'+i);
    d.className = 'dot' + (i<current?' done':'') + (i===current?' active':'');
  }
  document.getElementById('stepLabelLine').innerHTML =
    `${dict.stepWord} <strong>${current}</strong> ${dict.stepOf} ${totalSteps} — ${dict.stepNames[current-1]}`;
  document.getElementById('prevBtn').style.visibility = current===1 ? 'hidden' : 'visible';
  document.getElementById('nextBtn').textContent = current===totalSteps ? dict.doneBtn : dict.nextBtn;
  document.getElementById('nextBtn').style.display = current===totalSteps ? 'none' : 'block';
}

function showStep(n){
  document.querySelectorAll('.step').forEach(s=>{
    s.classList.toggle('active', parseInt(s.dataset.step)===n);
  });
  renderStepper();
  window.scrollTo({top:0,behavior:'smooth'});
  if(n===5){
    // le canvas de signature a une taille nulle tant qu'il est caché (display:none) ;
    // on force son recalcul de taille une fois l'étape affichée
    requestAnimationFrame(()=>{ pad1.refresh(); pad2.refresh(); });
  }
  if(n===6){
    newCaptchaChallenge();
  }
}

function collegeCounts(){
  const counts = {};
  SCHOOLS.forEach(([,college])=>{ counts[college] = (counts[college]||0) + 1; });
  return counts;
}
const COLLEGE_NAME_COUNTS = collegeCounts();

function populateCommuneSelect(){
  const sel = document.getElementById('schoolTown');
  const prevVal = sel.value;
  const communes = [...new Set(SCHOOLS.map(([c])=>c))].sort((a,b)=>a.localeCompare(b,'fr'));
  sel.innerHTML = `<option value="">${tr('sexSelectPlaceholder')}</option>` +
    communes.map(c=>`<option value="${c}">${c}</option>`).join('');
  if(communes.includes(prevVal)) sel.value = prevVal;
}

function populateCollegeSelect(filterCommune){
  const sel = document.getElementById('schoolName');
  const prevVal = sel.value;
  let list = filterCommune ? SCHOOLS.filter(([c])=>c===filterCommune) : SCHOOLS.slice();
  list = list.slice().sort((a,b)=>a[1].localeCompare(b[1],'fr'));
  sel.innerHTML = `<option value="">${tr('sexSelectPlaceholder')}</option>` +
    list.map(([commune,college])=>{
      const label = (!filterCommune && COLLEGE_NAME_COUNTS[college] > 1) ? `${college} (${commune})` : college;
      return `<option value="${college}" data-commune="${commune}">${label}</option>`;
    }).join('');
  if(list.some(([,college])=>college===prevVal)) sel.value = prevVal;
}

document.getElementById('schoolTown').addEventListener('change', ()=>{
  const commune = document.getElementById('schoolTown').value;
  populateCollegeSelect(commune || null);
  markInvalid(document.getElementById('schoolTown'), false);
});

document.getElementById('schoolName').addEventListener('change', ()=>{
  const sel = document.getElementById('schoolName');
  const opt = sel.selectedOptions[0];
  const commune = opt ? opt.dataset.commune : '';
  if(commune){
    document.getElementById('schoolTown').value = commune;
    populateCollegeSelect(commune);
    markInvalid(document.getElementById('schoolTown'), false);
  }
  markInvalid(sel, false);
});

const LATIN_NAME_RE = /[^A-Za-zÀ-ÖØ-öø-ÿ' \-]/g;
['childLastName','childFirstName','p1Name','p2Name'].forEach(id=>{
  const el = document.getElementById(id);
  el.addEventListener('input', ()=>{
    const cleaned = el.value.replace(LATIN_NAME_RE, '');
    if(cleaned !== el.value) el.value = cleaned;
  });
});

// ---- Signature pads ----
function setupPad(id){
  const canvas = document.getElementById(id);
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let hasDrawn = false;

  function resize(){
    const ratio = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#0b3d5c';
  }
  resize();
  function resizePreserving(){
    const data = hasDrawn ? canvas.toDataURL() : null;
    resize();
    if(data){
      const img = new Image();
      img.onload = ()=> ctx.drawImage(img,0,0,canvas.getBoundingClientRect().width,canvas.getBoundingClientRect().height);
      img.src = data;
    }
  }
  window.addEventListener('resize', resizePreserving);

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - rect.left, y: t.clientY - rect.top};
  }
  function start(e){ drawing = true; hasDrawn = true; markInvalid(canvas.closest('.sig-wrap'), false); const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
  function end(){ drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);

  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn = false; },
    isEmpty(){ return !hasDrawn; },
    dataUrl(){ return canvas.toDataURL('image/png'); },
    refresh(){ resizePreserving(); }
  };
}
const pad1 = setupPad('sig1');
const pad2 = setupPad('sig2');
function clearSig(n){ (n===1?pad1:pad2).clear(); }

// ---- Validation per step ----
function markInvalid(el, invalid){
  if(!el) return;
  el.classList.toggle('field-invalid', !!invalid);
}
function clearInvalidOnChange(el){
  if(!el) return;
  const clear = () => markInvalid(el, false);
  el.addEventListener('input', clear);
  el.addEventListener('change', clear);
}
// Les champs texte/select retirent leur surlignage rouge dès que l'utilisateur les modifie
['childLastName','childFirstName','childDob','childSex','childClass','schoolName','schoolTown',
 'p1Name','p1Phone','p1Nir','p2Nir','signDate','captchaAnswer'].forEach(id => clearInvalidOnChange(document.getElementById(id)));

function validateStep(n){
  if(n===1){
    const ids = ['childLastName','childFirstName','childDob','childSex','childClass','schoolName','schoolTown'];
    let ok = true;
    ids.forEach(id=>{
      const el = document.getElementById(id);
      const empty = el.value.trim() === '';
      markInvalid(el, empty);
      if(empty) ok = false;
    });
    return ok;
  }
  if(n===2){
    const attach = document.querySelector('input[name="attach"]:checked');
    const p1Name = document.getElementById('p1Name');
    const p1Phone = document.getElementById('p1Phone');
    const p1Nir = document.getElementById('p1Nir');
    const p2Nir = document.getElementById('p2Nir');
    const p1NirOk = p1Nir.value.length === 15;
    const p2NirOk = p2Nir.value.length === 0 || p2Nir.value.length === 15;
    markInvalid(p1Name, p1Name.value.trim()==='');
    markInvalid(p1Phone, p1Phone.value.trim()==='');
    markInvalid(p1Nir, !p1NirOk);
    markInvalid(p2Nir, !p2NirOk);
    document.querySelectorAll('input[name="attach"]').forEach(r=>{
      markInvalid(r.closest('.radio-line'), !attach);
    });
    return p1Name.value.trim() !== '' &&
           p1Phone.value.trim() !== '' &&
           p1NirOk && p2NirOk &&
           !!attach;
  }
  if(n===3){
    const ok = authState.hpv && authState.acwy && authState.other;
    document.getElementById('authError').classList.toggle('show', !ok);
    ['blockHpv','blockAcwy','blockOther'].forEach((id,i)=>{
      const states = [authState.hpv, authState.acwy, authState.other];
      markInvalid(document.getElementById(id), !states[i]);
    });
    return !!ok;
  }
  if(n===4){
    const checked = document.querySelector('input[name="carnet"]:checked');
    document.querySelectorAll('.carnet-option').forEach(o=>markInvalid(o, !checked));
    return !!checked;
  }
  if(n===5){
    const signDateEl = document.getElementById('signDate');
    const dateOk = signDateEl.value.trim() !== '';
    const soloOnly = document.getElementById('soloOnly').checked;
    const soloAbsent = document.getElementById('soloAbsent').checked;
    const sig1ok = !pad1.isEmpty();
    const sig2ok = !pad2.isEmpty();
    const ok = dateOk && sig1ok && (sig2ok || soloOnly || soloAbsent);
    document.getElementById('sigError').classList.toggle('show', !ok);
    markInvalid(signDateEl, !dateOk);
    markInvalid(document.getElementById('sig1').closest('.sig-wrap'), !sig1ok);
    return ok;
  }
  return true;
}

document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(!validateStep(current)) return;
  if(current < totalSteps){
    current++;
    if(current===totalSteps) buildSummary();
    showStep(current);
  }
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(current>1){ current--; showStep(current); }
});

function labelYesNo(v){
  const dict = I18N[currentLang] || I18N.fr;
  return v==='yes' ? dict.yes : (v==='no' ? dict.no : dict.dash);
}

// ---- Vérification anti-robot (énigme simple, vérifiée aussi côté flux Power Automate) ----
let captchaA = 0, captchaB = 0;
function newCaptchaChallenge(){
  captchaA = Math.floor(Math.random()*8) + 1;
  captchaB = Math.floor(Math.random()*8) + 1;
  const input = document.getElementById('captchaAnswer');
  if(input){ input.value = ''; markInvalid(input, false); }
  document.getElementById('captchaError').classList.remove('show');
  updateCaptchaLabel();
}
function updateCaptchaLabel(){
  const dict = I18N[currentLang] || I18N.fr;
  const label = document.getElementById('captchaLabel');
  if(label) label.textContent = dict.captchaLabel.replace('{a}', captchaA).replace('{b}', captchaB);
}
function captchaIsValid(){
  const input = document.getElementById('captchaAnswer');
  return parseInt(input.value, 10) === (captchaA + captchaB);
}

function buildSummary(){
  const dict = I18N[currentLang] || I18N.fr;
  const other = [];
  if(document.getElementById('subDtp').checked) other.push('DTP-coq');
  if(document.getElementById('subRor').checked) other.push('ROR');
  if(document.getElementById('subHepb').checked) other.push('Hépatite B');

  const items = [
    [dict.recapChild, `${document.getElementById('childFirstName').value} ${document.getElementById('childLastName').value}`],
    [dict.recapSchool, `${document.getElementById('schoolName').value} (${document.getElementById('schoolTown').value})`],
    [dict.recapHpv, labelYesNo(authState.hpv)],
    [dict.recapAcwy, labelYesNo(authState.acwy)],
    [dict.recapOther, labelYesNo(authState.other) + (other.length ? " — " + other.join(', ') : '')],
    [dict.recapCarnet, document.getElementById('carnetFourni').checked ? dict.carnetProvided : dict.carnetNotProvided],
    [dict.recapSignatures, (!pad1.isEmpty()?"1 ✓ ":"") + (!pad2.isEmpty()?"2 ✓":"")]
  ];
  const el = document.getElementById('summaryList');
  el.innerHTML = items.map(([k,v])=>`<div class="summary-item"><span>${k}</span><span>${v}</span></div>`).join('');

  updateMailtoBtn();
}

// ---- Bouton alternatif : ouvre l'application email avec sujet/corps pré-remplis ----
function updateMailtoBtn(){
  const dict = I18N[currentLang] || I18N.fr;
  const childFirst = document.getElementById('childFirstName').value;
  const childLast = document.getElementById('childLastName').value;
  const school = document.getElementById('schoolName').value;
  const town = document.getElementById('schoolTown').value;
  const subject = `${childFirst} ${childLast} - ${school} - ${town}`.trim();
  const mailBtn = document.getElementById('mailtoBtn');
  if(mailBtn){
    mailBtn.href = `mailto:vaccin-hpv@ghsif.fr?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(dict.mailtoBodyText)}`;
  }
}

function fmtDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

  const p2Labels = ["Nom et Prénom","Téléphone portable","Numéro de sécurité sociale"];

  // ---- Section 3 : autorisations ----
  sectionHeader("3. Autorisations à cocher");
  const leftW = USABLE_W*0.62, rightW = USABLE_W*0.38 - 2;

    const TITLE_INDENT = PAD_L + CB + GAP;      // texte du titre, aligné après la case à cocher

    const titleLines = wrap(titleTxt, leftW-TITLE_INDENT-2, 7.6, 'bold');

  authBlock(

  authBlock(
    "J’autorise la vaccination contre les méningites à méningocoque ACWY.",

  authBlock(

    "Je n’autorise pas la vaccination contre toutes les autres maladies recommandées par le calendrier vaccinal en vigueur",
    authState.other,
    [
      {label:"Diphtérie, tétanos, poliomyélite, coqueluche (DTP-coq)", hint:"Une dose de rappel est recommandée à l’âge de 6 ans, puis un rappel entre 11 et 13 ans", checked:document.getElementById('subDtp').checked},
      {label:"Rougeole, oreillons, rubéole (ROR)", hint:"Deux doses sont recommandées, à partir de l’âge de 12 mois révolus", checked:document.getElementById('subRor').checked},
      {label:"Hépatite B", hint:"Trois doses au total sont recommandées pour une protection à vie", checked:document.getElementById('subHepb').checked}
    ]
  );

  // ---- Section 4 : carnet de santé ----
  y += 2.2;
  sectionHeader("4. La présence du carnet de santé est essentielle pour analyser le statut vaccinal de votre enfant.");

  paragraph("La vaccination contre les infections invasives à méningocoques ACWY est recommandée chez tous les jeunes âgés de 11 à 14 ans. Les méningites sont des infections transmissibles graves qui touchent particulièrement les adolescents et les jeunes adultes. Elles peuvent conduire au décès ou laisser des séquelles importantes. La vaccination contre les méningocoques ACWY avec une dose unique de vaccin permet une protection efficace et prolongée. Comme pour tous les vaccins, quelques effets secondaires sont possibles et bénins pour la grande majorité.");
  setF('normal',8.6,INK);
  {
    const l1 = "Vous trouverez plus d’information sur le vaccin sur le site de l’Agence nationale de sécurité";

  paragraph("Avant la séance de vaccination, l’équipe médicale s’entretiendra avec votre enfant et vérifiera son carnet de santé. Votre enfant bénéficiera, ensuite, de l’injection d’une dose de vaccin contre les HPV et/ou une dose de vaccin contre les méningocoques ACWY dans un espace confidentiel. Il est possible d’administrer ces deux vaccins lors d’une même séance.");
  paragraph("Après la ou les injections, il peut se produire des évanouissements, parfois accompagnés de tremblements ou raideurs et pouvant être accompagnés de chutes. Bien que les cas d'évanouissement soient peu fréquents, votre enfant restera en observation, sous la surveillance de l’équipe médicale, durant les 15 minutes suivant l’injection du ou des vaccins. Si l’équipe de vaccination offre ce service complémentaire, d’autres vaccinations recommandées pourront être réalisées (DTP coq, ROR, hépatite B) selon le statut vaccinal de votre enfant. Un maximum de 4 vaccins pourra être réalisé, en concertation avec votre enfant.");

  subHeading("MENTIONS D’INFORMATION INFORMATIQUES ET LIBERTÉS");
  paragraph("La présente campagne de vaccination implique la mise en œuvre de traitements de données à caractère personnel.");
  paragraph("En particulier, les formulaires d’autorisation à la vaccination seront utilisés, par les structures et centres de vaccination mobilisés par les ARS, aux fins d’organisation de la campagne nationale de vaccination contre les infections à papillomavirus humains et du rattrapage éventuel des autres vaccinations. Ces traitements sont mis en œuvre sous la responsabilité conjointe de l’ARS compétente et du centre de vaccination ou de la structure de prévention désignés par l’ARS réalisant la vaccination de votre enfant.");
  paragraph("L’établissement scolaire de votre enfant est uniquement chargé de collecter, pour le compte de ces responsables de traitement, la présente autorisation complétée par vos soins qu’il transmet ensuite au centre ou à la structure de vaccination. Cette transmission est réalisée sous enveloppe cachetée et les établissements n’ont donc pas connaissance des informations qui y figurent.");
  paragraph("Sont uniquement destinataires des données collectées les personnels habilités au sein des structures de santé désignées par l’ARS sur leur territoire. Elles pourront être conservées par ces entités à des fins d’éventuelles recherches en responsabilité, pendant 18 ans à compter de l’acte de vaccination.");
  paragraph("Les droits d’accès, de rectification, de limitation et d’opposition, prévus par les articles 15, 16, 18 et 21 du RGPD, s’agissant du traitement relatif aux formulaires d’autorisation s’exercent auprès du chef d’établissement qui transmet sans délai et par tout moyen, les demandes d’exercice des droits des personnes au centre ou à la structure de vaccination territorialement compétent.");
  paragraph("Par ailleurs, ces formulaires seront utilisés, après l’acte de vaccination effectué au sein de l’établissement, par ces mêmes centres et structures de vaccination, afin d’adresser à l’Assurance maladie les éléments nécessaires à la prise en charge de ces vaccins.");
  paragraph("Des informations complémentaires sur ces traitements sont mises à votre disposition sur le site internet du ministère chargé de la santé et des ARS.");

  const qrY = 260, qrS = 24;

  doc.text("Plus d'info sur la campagne de", 158, qrY+qrS+3.2, {align:'center'});
  doc.text("vaccination Sud 77", 158, qrY+qrS+6.4, {align:'center'});

  return doc;
}

function pdfToBase64(pdfDoc){
  // doc.output('datauristring') renvoie "data:application/pdf;filename=...;base64,XXXX"
  const dataUri = pdfDoc.output('datauristring');

  const town = document.getElementById('schoolTown').value.trim();
  const childLast = document.getElementById('childLastName').value.trim();
  const childFirst = document.getElementById('childFirstName').value.trim();
  const parts = [school, town, childLast, childFirst].filter(Boolean);
  const base = parts.length ? parts.join('-') : 'enfant';
  return base.replace(/\s+/g, '-') + '.pdf';
}

document.getElementById('sendEmailBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('sendEmailBtn');
  const originalLabel = btn.textContent;

  // Vérification anti-robot côté site avant tout envoi
  if(!captchaIsValid()){
    markInvalid(document.getElementById('captchaAnswer'), true);
    document.getElementById('captchaError').classList.add('show');
    newCaptchaChallenge();
    return;
  }

  btn.disabled = true;
  btn.textContent = tr('sendingLabel');
  try{
    const pdfDoc = buildPdf();
    const pdfBase64 = pdfToBase64(pdfDoc);

    const childFirst = document.getElementById('childFirstName').value;
    const childLast = document.getElementById('childLastName').value;
    const school = document.getElementById('schoolName').value;
    const town = document.getElementById('schoolTown').value;
    const filename = buildPdfFilename();

    const payload = {
      pdf_base64: pdfBase64,
      filename: filename,
      child_name: `${childFirst} ${childLast}`,
      school_name: `${school} (${town})`,
      secret_key: POWER_AUTOMATE_SECRET,
      // Vérification anti-robot redondante côté flux (indispensable : un script direct
      // vers l'URL du flux, sans passer par le site, contournerait sinon ce contrôle)
      captcha_a: captchaA,
      captcha_b: captchaB,
      captcha_answer: parseInt(document.getElementById('captchaAnswer').value, 10)
    };

    const resp = await fetch(POWER_AUTOMATE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if(!resp.ok){
      throw new Error('HTTP ' + resp.status);
    }

    document.getElementById('emailSentNote').style.display = 'block';
    document.getElementById('reassuranceMsg').style.display = 'block';
    newCaptchaChallenge();
  } catch(err){
    console.error(err);
    alert(tr('sendErrorAlert').replace('{detail}', err.message));
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

// ---- Téléchargement ----
document.getElementById('downloadBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('downloadBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = tr('generatingLabel');
  try{
    const doc = buildPdf();
    const filename = buildPdfFilename();
    const blob = doc.output('blob');

    const downloadsApi = (window.claude && typeof window.claude.use === 'function')
      ? await window.claude.use('downloads')
      : null;

    if(downloadsApi){
      try{
        await downloadsApi.save({ filename, data: blob });
        document.getElementById('downloadedNote').style.display = 'block';
      } catch(saveErr){
        if(saveErr && saveErr.code === 'declined'){
          // annulé par l'utilisateur, rien à signaler
        } else {
          console.error(saveErr);
          alert(tr('downloadFailAlert').replace('{code}', saveErr && saveErr.code ? saveErr.code : 'unknown'));
        }
      }
    } else {
      doc.save(filename);
      document.getElementById('downloadedNote').style.display = 'block';
    }
  } catch(err){
    console.error(err);
    alert(tr('downloadErrorAlert'));
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
});

// default date = today
document.getElementById('signDate').valueAsDate = new Date();

applyLanguage();
showStep(current);
</script>
